<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensagem Enviada | Edmilson Mula</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    
    .container {
      max-width: 600px;
      padding: 40px;
      background: #222;
      border-radius: 10px;
      border: 1px solid #ff714a;
    }
    
    h1 {
      color: #ff714a;
      margin-bottom: 20px;
    }
    
    p {
      color: #d5d5d5;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    
    .btn {
      display: inline-block;
      padding: 12px 30px;
      background: transparent;
      border: 2px solid #ff714a;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    
    .btn:hover {
      background: #ff714a;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mensagem Enviada! ✓</h1>
    <p>Obrigado pelo seu contacto. Recebi a sua mensagem e entrarei em contacto consigo em breve.</p>
    <a href="index.html" class="btn">Voltar ao Portfólio</a>
  </div>
</body>
</html>
